name: ci

on:
  pull_request:
  push:
    branches: [main]

# Two overlapping deploys could leave the live Worker on whichever finished last.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci

      # The Worker must already exist (poietic-dot-tech infra/tinkers.tf).
      # Deploying first would let OpenTofu's create overwrite it with its
      # placeholder.
      - run: npx wrangler deploy

      - run: printf '%s' "$CF_TURN_KEY_ID" | npx wrangler secret put CF_TURN_KEY_ID
        env:
          CF_TURN_KEY_ID: ${{ secrets.CF_TURN_KEY_ID }}

      - run: printf '%s' "$CF_TURN_KEY_API_TOKEN" | npx wrangler secret put CF_TURN_KEY_API_TOKEN
        env:
          CF_TURN_KEY_API_TOKEN: ${{ secrets.CF_TURN_KEY_API_TOKEN }}
